<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>流程管理系统 PMS</title>
<style>
:root{
  --bg:#f4f6fb; --panel:#ffffff; --line:#e8ecf4; --text:#1a2233; --sub:#6b7688;
  --brand:#2f5bea; --brand-soft:#eaf0ff; --ok:#16a34a; --warn:#f59e0b; --bad:#ef4444;
  --radius:14px; --shadow:0 2px 12px rgba(20,40,100,.06);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Microsoft YaHei","WenQuanYi Micro Hei",sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;line-height:1.6}
.app{display:flex;min-height:100vh}

/* ===== 侧边栏 ===== */
.side{width:230px;background:#111a2e;color:#c8d2e6;flex-shrink:0;display:flex;flex-direction:column}
.side .logo{padding:22px 20px;font-size:17px;font-weight:700;color:#fff;letter-spacing:.5px;
  border-bottom:1px solid rgba(255,255,255,.08)}
.side .logo span{display:block;font-size:11px;font-weight:400;color:#7d8ab0;margin-top:3px;letter-spacing:1px}
.nav{padding:14px 10px;flex:1;overflow-y:auto}
.nav .grp{font-size:11px;color:#5c6a8c;padding:14px 12px 6px;letter-spacing:1px}
.nav a{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;
  color:#c8d2e6;text-decoration:none;font-size:13.5px;margin-bottom:2px;cursor:pointer;transition:.15s}
.nav a .ic{width:18px;text-align:center;font-size:15px}
.nav a:hover{background:rgba(255,255,255,.07)}
.nav a.active{background:var(--brand);color:#fff;box-shadow:0 4px 14px rgba(47,91,234,.4)}
.side .foot{padding:16px 20px;font-size:11px;color:#5c6a8c;border-top:1px solid rgba(255,255,255,.08)}

/* ===== 主区 ===== */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:62px;background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;align-items:center;padding:0 26px;gap:16px}
.topbar h1{font-size:17px;font-weight:600;flex:1}
.search{flex:1;max-width:320px;position:relative}
.search input{width:100%;padding:9px 14px 9px 34px;border:1px solid var(--line);border-radius:9px;
  background:#f8fafd;font-size:13px;outline:none}
.search::before{content:"🔍";position:absolute;left:11px;top:8px;font-size:12px;opacity:.5}
.usr{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--brand);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px}
.view{padding:24px 26px;overflow-y:auto;flex:1}

/* ===== 通用卡片 ===== */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:20px;margin-bottom:20px}
.card h2{font-size:15px;font-weight:600;margin-bottom:4px}
.card .desc{font-size:12.5px;color:var(--sub);margin-bottom:16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}

/* ===== 仪表盘 ===== */
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:18px 20px}
.kpi .num{font-size:27px;font-weight:700;letter-spacing:-.5px}
.kpi .lab{font-size:12.5px;color:var(--sub);margin-top:2px}
.kpi .trend{font-size:12px;margin-top:6px;font-weight:500}
.up{color:var(--ok)}.down{color:var(--bad)}
.pipe{height:5px;background:#eef1f7;border-radius:3px;margin-top:10px;overflow:hidden}
.pipe i{display:block;height:100%;border-radius:3px}
.stagebar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.stagebar .nm{width:74px;font-size:13px;color:var(--sub)}
.stagebar .bar{flex:1;height:8px;background:#eef1f7;border-radius:4px;overflow:hidden}
.stagebar .bar i{display:block;height:100%;border-radius:4px;background:var(--brand)}
.stagebar .pc{width:40px;text-align:right;font-size:12.5px;font-weight:600}

/* ===== 表格 ===== */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;padding:10px 12px;font-size:12px;color:var(--sub);
  font-weight:600;background:#f8fafd;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px;border-bottom:1px solid #f2f5fa;vertical-align:middle}
.tbl tr:hover td{background:#fafcff}
.tag{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
.t-red{background:#fdeaea;color:#d14343}.t-yel{background:#fef4e2;color:#c5830c}
.t-grn{background:#e7f6ec;color:#138a45}.t-blu{background:#eaf0ff;color:#2f5bea}
.pill{display:inline-flex;align-items:center;gap:5px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--brand);display:inline-block}
.btn{padding:8px 16px;border:none;border-radius:9px;font-size:13px;cursor:pointer;
  font-family:inherit;font-weight:500;transition:.15s}
.btn-p{background:var(--brand);color:#fff}
.btn-p:hover{background:#1f48cc}
.btn-g{background:#f2f5fa;color:var(--text)}
.btn-sm{padding:5px 11px;font-size:12px;border-radius:7px;border:1px solid var(--line);background:#fff}
.mt{margin-top:16px}.mb{margin-bottom:16px}.flex{display:flex}.gap{display:flex;gap:10px}
.between{display:flex;justify-content:space-between;align-items:center}
.link{color:var(--brand);cursor:pointer;text-decoration:none}
.link:hover{text-decoration:underline}

/* ===== 工作流画布 ===== */
.flow{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding:6px 2px}
.phase{flex:1;min-width:196px;position:relative}
.phase-hd{font-size:13px;font-weight:600;padding:9px 14px;border-radius:9px 9px 0 0;color:#fff}
.phase-bd{background:#f8fafd;border:1px solid var(--line);border-top:none;
  border-radius:0 0 9px 9px;padding:12px;min-height:230px}
.step{background:#fff;border:1px solid var(--line);border-left:3px solid var(--brand);
  border-radius:8px;padding:9px 11px;margin-bottom:9px;font-size:12.5px;cursor:pointer;transition:.15s}
.step:hover{box-shadow:0 3px 10px rgba(20,40,100,.09);transform:translateX(2px)}
.step b{display:block;font-size:12.5px;margin-bottom:2px}
.step span{color:var(--sub);font-size:11.5px}
.arrow{display:flex;align-items:center;color:#c3cbe0;font-size:18px;padding:0 6px}

/* ===== 工具箱 ===== */
.tool{border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;transition:.15s;background:#fff}
.tool:hover{border-color:var(--brand);box-shadow:0 4px 14px rgba(47,91,234,.1);transform:translateY(-2px)}
.tool .ico{font-size:22px;margin-bottom:8px}
.tool h4{font-size:13.5px;margin-bottom:4px}
.tool p{font-size:11.5px;color:var(--sub);line-height:1.5}
.tool .tag{margin-top:8px}

/* ===== 画布（泳道） ===== */
.lane{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px}
.lane-hd{background:#f8fafd;padding:10px 16px;font-weight:600;font-size:13px;
  display:flex;justify-content:space-between;border-bottom:1px solid var(--line)}
.lane-bd{display:flex;padding:14px;gap:10px;overflow-x:auto;min-height:66px;align-items:center;background:#fff}
.node{min-width:150px;max-width:190px;border:1px solid var(--line);border-radius:9px;
  padding:10px 12px;font-size:12.5px;background:#fff;cursor:pointer;position:relative}
.node:hover{border-color:var(--brand);box-shadow:0 3px 10px rgba(47,91,234,.12)}
.node b{display:block;font-size:12.5px}
.node .meta{font-size:11px;color:var(--sub);margin-top:3px}
.node.start{border-left:3px solid var(--ok);background:#f5fbf7}
.node.end{border-left:3px solid var(--bad);background:#fdf6f6}
.node.gate{border-left:3px solid var(--warn);background:#fffbf2}
.add{border:1.5px dashed #cfd8ea;border-radius:9px;padding:10px 18px;color:var(--sub);
  font-size:12px;cursor:pointer;background:#fbfcff}
.add:hover{border-color:var(--brand);color:var(--brand)}
.legend{display:flex;gap:18px;font-size:12px;color:var(--sub);flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* ===== 模态框 ===== */
.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;
  justify-content:center;z-index:50;padding:20px}
.mask.show{display:flex}
.modal{background:#fff;border-radius:16px;width:100%;max-width:560px;max-height:86vh;
  overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal-hd{padding:18px 22px;border-bottom:1px solid var(--line);font-size:16px;font-weight:600;
  display:flex;justify-content:space-between;align-items:center}
.modal-hd .x{cursor:pointer;color:var(--sub);font-size:20px;line-height:1}
.modal-bd{padding:20px 22px}
.modal-ft{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;color:var(--sub);margin-bottom:5px;font-weight:500}
.field input,.field select,.field textarea{width:100%;padding:9px 12px;border:1px solid var(--line);
  border-radius:9px;font-size:13px;font-family:inherit;outline:none;background:#fff}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(47,91,234,.12)}
.field textarea{resize:vertical;min-height:64px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tabs{display:flex;gap:4px;background:#f2f5fa;padding:4px;border-radius:10px;margin-bottom:16px}
.tabs button{flex:1;border:none;background:none;padding:8px;font-size:13px;border-radius:7px;cursor:pointer;font-family:inherit;color:var(--sub)}
.tabs button.on{background:#fff;color:var(--text);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.hide{display:none}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:#111a2e;color:#fff;
  padding:11px 22px;border-radius:10px;font-size:13px;z-index:60;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1}
.empty{text-align:center;color:var(--sub);padding:40px;font-size:13px}
.mtr{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.mtr .k{width:96px;font-size:12.5px}
.mtr .track{flex:1;height:7px;background:#eef1f7;border-radius:4px;overflow:hidden}
.mtr .track i{display:block;height:100%;border-radius:4px}
.mtr .v{width:44px;text-align:right;font-size:12.5px;font-weight:600}
canvas{max-width:100%}
</style>
</head>

const view = document.getElementById('view');

document.querySelectorAll('.nav a').forEach(a=>a.onclick=()=>{

  a.classList.add('active');

  render(a.dataset.view);
});
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function methodTag(m){const [c,n]=METHOD[m]||['t-blu',m];return `<span class="tag ${c}">${n}</span>`}
function statusTag(s){const [c,n]=STATUS[s]||['t-blu',s];return `<span class="tag ${c}">${n}</span>`}

function render(v){
  if(v==='dashboard') return renderDashboard();
  if(v==='map') return renderMap();
  if(v==='workflow') return renderWorkflow();
  if(v==='projects') return renderProjects();
  if(v==='toolbox') return renderToolbox();
  if(v==='designer') return renderDesigner();
  if(v==='monitor') return renderMonitor();
  if(v==='knowledge') return renderKnowledge();
}

/* ---------- 仪表盘 ---------- */
function renderDashboard(){
  const p = DB.projects;
  const total = p.length, run = p.filter(x=>x.status==='running').length;
  const budget = p.reduce((s,x)=>s+x.budget,0), spent = p.reduce((s,x)=>s+x.spent,0);
  const cycle = (p.reduce((s,x)=>s+x.kpi[0].g,0)/p.length).toFixed(0);
  const html = `
  <div class="g4 mb">
    ${kpi('进行中项目','up',run+' / '+total,'较上月 +1','#2f5bea')}
    ${kpi('流程周期效率','up',cycle+'%','目标 ≥70%','#16a34a')}
    ${kpi('年度投入','',spent+' 万','预算 '+budget+' 万','#f59e0b')}
    ${kpi('待启动项目','',p.filter(x=>x.status==='pending').length+' 个','筹备中','#6b7688')}
  </div>

  <div class="grid g2">
    <div class="card">
      <h2>五阶段推进健康度</h2>
      <div class="desc">各阶段项目覆盖与完成度</div>
      ${STAGES.map((s,i)=>{const n=p.filter(x=>x.stage>i).length, c=p.filter(x=>x.stage===i+1).length;
        const pc=Math.round(((i)*total+c*0.5)/total/5*100);
        return `<div class="stagebar"><span class="nm">阶段${i+1}</span><span class="bar"><i style="width:${Math.max(pc,8)}%;background:${i<4?'#2f5bea':'#16a34a'}"></i></span><span class="pc">${pc}%</span></div>`}).join('')}
      <div class="between" style="margin-top:10px;font-size:12px;color:var(--sub)">
        <span>覆盖项目 ${total} 个</span><span>完成率 ${Math.round(p.filter(x=>x.stage===5).length/total*100)}%</span>
      </div>
    </div>
    <div class="card">
      <h2>方法论分布</h2>
      <div class="desc">BPR / BPI / 精益 项目配比</div>
      ${['BPR','BPI','精益'].map(m=>{const n=p.filter(x=>x.method===m).length;
        const w=Math.round(n/total*100);
        return `<div class="mtr"><span class="k">${METHOD[m][1]}</span><span class="track"><i style="width:${w}%;background:${['#d14343','#c5830c','#138a45'][['BPR','BPI','精益'].indexOf(m)]}"></i></span><span class="v">${w}%</span></div>`}).join('')}
      <div class="legend" style="margin-top:6px">
        <span><i style="background:#d14343"></i>BPR 根本性重组</span>
        <span><i style="background:#c5830c"></i>BPI 渐进优化</span>
        <span><i style="background:#138a45"></i>精益 消除浪费</span>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="between mb"><h2 style="margin:0">重点流程项目看板</h2><a class="link" onclick="render('projects')">查看全部 →</a></div>
    <table class="tbl">
      <thead><tr><th>项目编号</th><th>项目名称</th><th>方法</th><th>当前阶段</th><th>目标</th><th>周期效率</th><th>状态</th><th></th></tr></thead>
      <tbody>
      ${p.slice(0,5).map(x=>`
        <tr>
          <td style="color:var(--sub);font-size:12px">${x.id}</td>
          <td><b>${esc(x.name)}</b><div style="font-size:11.5px;color:var(--sub)">Owner: ${x.owner} · ${x.team}人团队</div></td>
          <td>${methodTag(x.method)}</td>
          <td><span class="dot"></span> 阶段${x.stage} ${STAGES[x.stage-1].slice(0,4)}</td>
          <td style="font-size:12.5px">${esc(x.target)}</td>
          <td><div style="width:80px"><div class="pipe"><i style="width:${x.kpi[0].g}%;background:${x.kpi[0].g>=70?'#16a34a':x.kpi[0].g>=40?'#f59e0b':'#ef4444'}"></i></div><span style="font-size:11px;color:var(--sub)">${x.kpi[0].g}%</span></div></td>
          <td>${statusTag(x.status)}</td>
          <td><button class="btn-sm" onclick="openProject('${x.id}')">详情</button></td>
        </tr>`).join('')}
      </tbody>
    </table>
  </div>`;
  view.innerHTML = html;
}
function kpi(lab,cls,num,trend,color){return `<div class="kpi"><div class="num" style="color:${color}">${num}</div><div class="lab">${lab}</div><div class="trend ${cls}">${trend}</div></div>`}

function renderMap(){

    <h2>企业流程架构（L1 → L4 分层）</h2>
    <div class="desc">点击层级节点可逐级展开下钻，查看流程 Owner 与待改善项</div>
    <div class="legend mb">
      <span><i style="background:#2f5bea"></i>流程节点</span>
      <span><i style="background:#ef4444"></i>待改善项（痛点）</span>
      <span><i style="background:#16a34a"></i>已完成优化</span>
      <span style="color:var(--sub)">条长代表该层流程数量</span>
    </div>
  </div>`;
  DB.map.forEach(group=>{
    body += `<div class="card">
      <div class="between mb"><h2 style="margin:0">${group.lvl}</h2><span style="font-size:12px;color:var(--sub)">${group.items.length} 个流程</span></div>
      <div class="g3">${group.items.map(it=>{
        const heat = it.process>30?'#ef4444':it.process>15?'#f59e0b':it.process>0?'#2f5bea':'#16a34a';
        return `<div class="step" style="border-left-color:${heat};min-height:auto" onclick="drill('${it.child}','${esc(it.name)}')">
          <b>${esc(it.name)}</b>
          <span>Owner: ${esc(it.owner)}</span><br>
          <span>待改善项: <b style="color:${heat}">${it.process}</b> 个</span>
          <div class="pipe"><i style="width:${Math.max(it.process*2.2,6)}%;background:${heat}"></i></div>
        </div>`}).join('')}
      </div>
    </div>`;
  });
  view.innerHTML = body;
}

function riskNote(x){return x.status==='pending'?'尚未启动，需先完成 Owner 任命与资源到位':'需重点关注：跨部门协同阻力、IT 系统改造周期、流程 Owner 时间投入'}

 '5 Why 根因分析':['清晰定义问题现象','连续追问"为什么"5层','每层证据验证不跳跃','找到可干预的根因','制定针对根因的纠正措施'],

function drawRadar(){
  const c = document.getElementById('radar'); if(!c) return;
  const ctx = c.getContext('2d'); const cx=180, cy=150, r=100;
  const dims = ['效率','质量','成本','灵活性'];
  const cur = [58,92,75,66], tgt = [70,95,85,80];
  ctx.clearRect(0,0,360,300);
  // 网格
  for(let g=1;g<=4;g++){ctx.beginPath();
    [0,1,2,3].forEach(i=>{const a=-Math.PI/2+i*Math.PI/2;const rr=r*g/4;
      const x=cx+rr*Math.cos(a),y=cy+rr*Math.sin(a);
      i?ctx.lineTo(x,y):ctx.moveTo(x,y);});
    ctx.closePath();ctx.strokeStyle='#e8ecf4';ctx.stroke();}
  // 轴线 + 标签
  dims.forEach((d,i)=>{const a=-Math.PI/2+i*Math.PI/2;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+r*Math.cos(a),cy+r*Math.sin(a));
    ctx.strokeStyle='#e8ecf4';ctx.stroke();
    ctx.fillStyle='#6b7688';ctx.font='12px sans-serif';
    ctx.fillText(d,cx+(r+18)*Math.cos(a)-10,cy+(r+18)*Math.sin(a)+4);});
  // 目标
  ctx.beginPath();tgt.forEach((v,i)=>{const a=-Math.PI/2+i*Math.PI/2;const rr=r*v/100;
    const x=cx+rr*Math.cos(a),y=cy+rr*Math.sin(a);i?ctx.lineTo(x,y):ctx.moveTo(x,y);});
  ctx.closePath();ctx.fillStyle='rgba(47,91,234,0.08)';ctx.fill();
  ctx.strokeStyle='#2f5bea';ctx.setLineDash([4,3]);ctx.stroke();ctx.setLineDash([]);
  // 当前
  ctx.beginPath();cur.forEach((v,i)=>{const a=-Math.PI/2+i*Math.PI/2;const rr=r*v/100;
    const x=cx+rr*Math.cos(a),y=cy+rr*Math.sin(a);i?ctx.lineTo(x,y):ctx.moveTo(x,y);});
  ctx.closePath();ctx.fillStyle='rgba(22,163,74,0.18)';ctx.fill();
  ctx.strokeStyle='#16a34a';ctx.lineWidth=2;ctx.stroke();ctx.lineWidth=1;
  // 图例
  ctx.fillStyle='#16a34a';ctx.fillRect(20,278,20,3);
  ctx.fillStyle='#6b7688';ctx.font='11px sans-serif';ctx.fillText('当前',44,282);
  ctx.fillStyle='#2f5bea';ctx.fillRect(90,278,20,3);ctx.fillStyle='#6b7688';ctx.fillText('目标',114,282);
}

/* ============ 模态框 ============ */
function openModal(title,body,foot){
  document.getElementById('mTitle').textContent = title;
  document.getElementById('mBody').innerHTML = body;
  document.getElementById('mFoot').innerHTML = foot||'<button class="btn btn-g" onclick="closeModal()">关闭</button>';
  document.getElementById('mask').classList.add('show');
}
function closeModal(){document.getElementById('mask').classList.remove('show')}
document.getElementById('mask').onclick = e=>{if(e.target.id==='mask')closeModal()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
